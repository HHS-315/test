<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="ref.css"><style>
nav{height:52px;padding:0 200px;display:flex;align-items:center;justify-content:space-between;background:rgba(245,245,247,.8);border-bottom:1px solid var(--hair)}
nav b{font:600 21px var(--d)} nav span{font-size:14px;display:flex;gap:28px;align-items:center}
.cart{border:1px solid var(--hair);border-radius:999px;padding:6px 14px}
.wrap{display:grid;grid-template-columns:1.1fr 1fr;gap:64px;padding:56px 200px}
.photo{background:var(--parch);border-radius:18px;aspect-ratio:1/1;display:grid;place-items:center;padding:56px}
.thumbs{display:flex;gap:12px;margin-top:12px}.thumbs div{width:84px;height:84px;border-radius:12px;background:var(--parch);display:grid;place-items:center;padding:10px;border:2px solid transparent}.thumbs div.on{border-color:var(--focus)}
.eyebrow{color:var(--muted);font-size:14px}h1{font:600 40px/1.1 var(--d);margin-top:6px}
.price{font:400 21px var(--d);margin-top:10px}.price small{display:block;color:var(--muted);font-size:14px;margin-top:4px}
h2{font:600 17px var(--t);margin-top:36px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.chip{border:1px solid var(--hair);border-radius:18px;padding:16px 18px;display:flex;justify-content:space-between}
.chip.on{border:2px solid var(--focus);padding:15px 17px}.chip small{color:var(--muted)}
.sw{display:flex;gap:16px;margin-top:12px}.sw i{width:36px;height:36px;border-radius:50%;border:1px solid rgba(0,0,0,.15);display:block}
.sw i.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--focus)}
.selname{color:var(--muted);font-size:14px;margin-top:8px}
.add{margin-top:36px;width:100%;padding:14px 28px;border-radius:999px;background:var(--blue);color:#fff;font:300 18px var(--t);border:0}
.note{margin-top:14px;color:var(--muted);font-size:14px}
</style>
