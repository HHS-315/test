<!doctype html><html lang="ko"><meta charset="utf-8"><link rel="stylesheet" href="ref.css">
<style>
section{background:#fff;padding:96px max(24px,calc(50% - 560px));min-height:900px}
h2{font:600 56px/1.07 var(--display);letter-spacing:-.28px;text-align:center}
.sub{text-align:center;font:400 21px/1.38 var(--text);color:#6e6e73;margin-top:12px}
.grid{margin-top:56px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.card{border:1px solid var(--hair);border-radius:18px;padding:40px;display:flex;flex-direction:column}
.card.pick{border:2px solid #0071e3;padding:39px}
.tag{font:600 14px/1.29 var(--text);color:#bf4800;height:18px}
.tag{color:var(--blue)}
h3{font:600 34px/1.2 var(--display);margin-top:8px}
.price{font:600 28px/1.14 var(--display);margin-top:20px}
.price span{font:400 14px var(--text);color:var(--muted);display:block;margin-top:6px}
ul{list-style:none;padding:0;margin:28px 0 32px;border-top:1px solid var(--hair)}
li{padding:12px 0;border-bottom:1px solid var(--hair)}
li.off{color:var(--muted)}
.card .pill{align-self:flex-start;margin-top:auto}
</style>
<section>
<h2>나에게 맞는 소노 버즈.</h2>
<p class="sub">두 가지 모델 모두 무료 각인, 무료 배송.</p>
<div class="grid">
<div class="card"><p class="tag"></p><h3>소노 버즈</h3><p class="price">₩199,000<span>또는 월 ₩16,583 (12개월 무이자)</span></p>
<ul><li>액티브 노이즈 캔슬링</li><li>케이스 포함 30시간 재생</li><li>USB‑C 충전 케이스</li><li class="off">무선 충전 · 분실 위치 찾기</li></ul><a class="pill" href="#">구입하기</a></div>
<div class="card pick"><p class="tag">추천</p><h3>소노 버즈 프로</h3><p class="price">₩289,000<span>또는 월 ₩24,083 (12개월 무이자)</span></p>
<ul><li>강화된 노이즈 캔슬링 (−42dB)</li><li>케이스 포함 36시간 재생</li><li>무선 충전 케이스</li><li>분실 위치 찾기 · 스피커 내장 케이스</li></ul><a class="pill" href="#">구입하기</a></div>
</div>
</section>
